name: CI and ECR publication

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - "frontend/**"
      - "ops/**"
      - ".github/workflows/**"
  push:
    paths:
      - "backend/**"
      - "frontend/**"
      - "ops/**"
      - ".github/workflows/**"

concurrency:
  group: linkito-ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend tests
    uses: ./.github/workflows/backend-ci.yml

  frontend-ci:
    name: Frontend build
    uses: ./.github/workflows/frontend-ci.yml

  detect-backend-changes:
    name: Detect backend changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check files changed by this push
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          if grep -Eq '^(backend/|ops/deploy-backend\.sh$|\.github/workflows/backend-ci\.yml$)' <<< "$changed_files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  detect-frontend-changes:
    name: Detect frontend changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check files changed by this push
        id: detect
        env:
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")"
          if grep -Eq '^(frontend/|ops/deploy-frontend\.sh$)' <<< "$changed_files"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  publish-ecr:
    name: Build and publish ECR images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - backend-ci
      - frontend-ci
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 482545366347.dkr.ecr.us-east-1.amazonaws.com
      IMAGE_TAG: sha-${{ github.sha }}
      NEXT_PUBLIC_PUBLIC_URL: ${{ vars.NEXT_PUBLIC_PUBLIC_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::482545366347:role/linkito-github-deploy-role
          role-session-name: LinkitoECR-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "482545366347"

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

      - name: Check whether this commit is already published
        id: existing-images
        shell: bash
        run: |
          set -euo pipefail

          image_exists() {
            local repository="$1"
            local error_file
            error_file="$(mktemp)"

            if aws ecr describe-images \
              --region "$AWS_REGION" \
              --repository-name "$repository" \
              --image-ids "imageTag=$IMAGE_TAG" \
              >/dev/null 2>"$error_file"; then
              rm -f "$error_file"
              return 0
            fi

            if grep -q "ImageNotFoundException" "$error_file"; then
              rm -f "$error_file"
              return 1
            fi

            cat "$error_file" >&2
            rm -f "$error_file"
            return 2
          }

          if image_exists linkito-backend; then
            backend_status=0
          else
            backend_status=$?
          fi

          if image_exists linkito-frontend; then
            frontend_status=0
          else
            frontend_status=$?
          fi

          if [[ "$backend_status" -eq 2 || "$frontend_status" -eq 2 ]]; then
            echo "Could not check the existing ECR tags." >&2
            exit 1
          fi

          echo "backend_exists=$([[ "$backend_status" -eq 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "frontend_exists=$([[ "$frontend_status" -eq 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Build both container images
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$NEXT_PUBLIC_PUBLIC_URL" || "$NEXT_PUBLIC_PUBLIC_URL" != https://* ]]; then
            echo "Production environment variable NEXT_PUBLIC_PUBLIC_URL must contain an HTTPS URL." >&2
            exit 1
          fi

          docker build \
            --tag "$ECR_REGISTRY/linkito-backend:$IMAGE_TAG" \
            ./backend

          docker build \
            --build-arg "NEXT_PUBLIC_PUBLIC_URL=$NEXT_PUBLIC_PUBLIC_URL" \
            --tag "$ECR_REGISTRY/linkito-frontend:$IMAGE_TAG" \
            ./frontend

      - name: Publish images to ECR
        env:
          BACKEND_EXISTS: ${{ steps.existing-images.outputs.backend_exists }}
          FRONTEND_EXISTS: ${{ steps.existing-images.outputs.frontend_exists }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$BACKEND_EXISTS" == "false" ]]; then
            docker push "$ECR_REGISTRY/linkito-backend:$IMAGE_TAG"
          else
            echo "Backend image $IMAGE_TAG already exists; keeping its immutable tag."
          fi

          if [[ "$FRONTEND_EXISTS" == "false" ]]; then
            docker push "$ECR_REGISTRY/linkito-frontend:$IMAGE_TAG"
          else
            echo "Frontend image $IMAGE_TAG already exists; keeping its immutable tag."
          fi

      - name: Verify ECR image digests
        shell: bash
        run: |
          set -euo pipefail

          for repository in linkito-backend linkito-frontend; do
            digest="$(aws ecr describe-images \
              --region "$AWS_REGION" \
              --repository-name "$repository" \
              --image-ids "imageTag=$IMAGE_TAG" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
            echo "$repository:$IMAGE_TAG $digest" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  deploy-backend:
    name: Deploy backend to EC2 through SSM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-backend-changes.outputs.changed == 'true'
    needs:
      - backend-ci
      - frontend-ci
      - detect-backend-changes
      - publish-ecr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: linkito-production-backend
      cancel-in-progress: false
    environment: Production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 482545366347.dkr.ecr.us-east-1.amazonaws.com
      EC2_INSTANCE_ID: i-0b87f6e1e16e92948
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::482545366347:role/linkito-github-deploy-role
          role-session-name: LinkitoBackendDeploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "482545366347"

      - name: Send deployment script through SSM
        id: send-command
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected commit SHA format." >&2
            exit 1
          fi

          image_ref="$ECR_REGISTRY/linkito-backend:sha-$GITHUB_SHA"
          script_base64="$(base64 -w 0 ops/deploy-backend.sh)"
          remote_script="printf '%s' '$script_base64' | base64 -d > /tmp/linkito-deploy-backend.sh && chmod 700 /tmp/linkito-deploy-backend.sh && /tmp/linkito-deploy-backend.sh '$image_ref' '$GITHUB_SHA'; status=\$?; rm -f /tmp/linkito-deploy-backend.sh; exit \$status"

          jq -n \
            --arg instance "$EC2_INSTANCE_ID" \
            --arg command "$remote_script" \
            --arg commit "$GITHUB_SHA" \
            '{InstanceIds:[$instance],DocumentName:"AWS-RunShellScript",Parameters:{commands:[$command]},TimeoutSeconds:600,Comment:("Linkito backend deploy " + $commit)}' \
            > "$RUNNER_TEMP/ssm-input.json"

          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --cli-input-json "file://$RUNNER_TEMP/ssm-input.json" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment and health checks
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/ssm-error.txt"
          invocation_file="$RUNNER_TEMP/ssm-invocation.json"

          for attempt in {1..120}; do
            if aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              > "$invocation_file" 2> "$error_file"; then
              status="$(jq -r '.Status' "$invocation_file")"
            elif grep -Eq 'InvocationDoesNotExist|ThrottlingException' "$error_file"; then
              status="Pending"
            else
              cat "$error_file" >&2
              exit 1
            fi

            case "$status" in
              Success)
                jq -r '.StandardOutputContent // ""' "$invocation_file" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                jq '{Status,StatusDetails,ResponseCode,StandardErrorContent}' "$invocation_file" >&2
                jq -r '.StandardOutputContent // ""' "$invocation_file" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              *)
                echo "Unexpected SSM status: $status" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for the SSM deployment command." >&2
          exit 1

  deploy-frontend:
    name: Deploy frontend to EC2 through SSM
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-frontend-changes.outputs.changed == 'true' && needs.frontend-ci.result == 'success' && needs.publish-ecr.result == 'success' && needs.deploy-backend.result != 'failure' && needs.deploy-backend.result != 'cancelled'
    needs:
      - frontend-ci
      - detect-frontend-changes
      - publish-ecr
      - deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: linkito-production-deploy
      cancel-in-progress: false
    environment: Production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      ECR_REGISTRY: 482545366347.dkr.ecr.us-east-1.amazonaws.com
      EC2_INSTANCE_ID: i-0b87f6e1e16e92948
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::482545366347:role/linkito-github-deploy-role
          role-session-name: LinkitoFrontendDeploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "482545366347"

      - name: Send deployment script through SSM
        id: send-command
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected commit SHA format." >&2
            exit 1
          fi

          image_ref="$ECR_REGISTRY/linkito-frontend:sha-$GITHUB_SHA"
          script_base64="$(base64 -w 0 ops/deploy-frontend.sh)"
          remote_script="printf '%s' '$script_base64' | base64 -d > /tmp/linkito-deploy-frontend.sh && chmod 700 /tmp/linkito-deploy-frontend.sh && /tmp/linkito-deploy-frontend.sh '$image_ref' '$GITHUB_SHA'; status=\$?; rm -f /tmp/linkito-deploy-frontend.sh; exit \$status"

          jq -n \
            --arg instance "$EC2_INSTANCE_ID" \
            --arg command "$remote_script" \
            --arg commit "$GITHUB_SHA" \
            '{InstanceIds:[$instance],DocumentName:"AWS-RunShellScript",Parameters:{commands:[$command]},TimeoutSeconds:600,Comment:("Linkito frontend deploy " + $commit)}' \
            > "$RUNNER_TEMP/ssm-input.json"

          command_id="$(aws ssm send-command \
            --region "$AWS_REGION" \
            --cli-input-json "file://$RUNNER_TEMP/ssm-input.json" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment and health checks
        env:
          COMMAND_ID: ${{ steps.send-command.outputs.command_id }}
        shell: bash
        run: |
          set -euo pipefail
          error_file="$RUNNER_TEMP/ssm-error.txt"
          invocation_file="$RUNNER_TEMP/ssm-invocation.json"

          for attempt in {1..120}; do
            if aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              > "$invocation_file" 2> "$error_file"; then
              status="$(jq -r '.Status' "$invocation_file")"
            elif grep -Eq 'InvocationDoesNotExist|ThrottlingException' "$error_file"; then
              status="Pending"
            else
              cat "$error_file" >&2
              exit 1
            fi

            case "$status" in
              Success)
                jq -r '.StandardOutputContent // ""' "$invocation_file" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                jq '{Status,StatusDetails,ResponseCode,StandardErrorContent}' "$invocation_file" >&2
                jq -r '.StandardOutputContent // ""' "$invocation_file" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 1
                ;;
              Pending|InProgress|Delayed)
                sleep 5
                ;;
              *)
                echo "Unexpected SSM status: $status" >&2
                exit 1
                ;;
            esac
          done

          echo "Timed out waiting for the SSM frontend deployment command." >&2
          exit 1
